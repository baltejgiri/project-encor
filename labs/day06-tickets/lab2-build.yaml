lab:
  description: 'Build: gateways for two VLANs plus a routed link to R2.'
  notes: "REQUEST (from the network team)\n- R1 is the default gateway for both user VLANs: VLAN 10 uses 10.10.10.254/24, VLAN 20 uses 10.20.20.254/24.\n  R1 has one physical link to SW1.\n- VLAN 10 is also moving to a new range: 172.16.10.254/24 must work on R1 for VLAN 10 at the same time as the old one.\n- SW1 needs its own address in each user VLAN: 10.10.10.1/24 and 10.20.20.1/24.\n- SW1 connects to R2 over a point-to-point routed link: SW1 172.30.0.1/30, R2 172.30.0.2/30.\n- Everything must be dual stack:\n    VLAN 10  2001:db8:10::/64   (R1 ::1, SW1 ::2; R1 also needs 2001:db8:10::ff)\n    VLAN 20  2001:db8:20::/64   (R1 ::1, SW1 ::2)\n    SW1-R2   2001:db8:30::/64   (SW1 ::1, R2 ::2)\n\nQUESTIONS TO ANSWER ON STREAM (prove each answer with the device output)\n1. How is a switch's address in a VLAN different from the address on its port to R2?\n2. Under what conditions is SW1's VLAN 20 address unusable? Make it happen, then undo it.\n3. When PC1 sends a packet to R2's 172.30.0.2,\
    \ which devices does it pass through, and what changes in the frame at each hop?\n"
  title: 'Day 6 - Lab 2: Layer 3 Interfaces'
  version: 0.3.0
