lab:
  description: 'Troubleshoot: NOC tickets. No hints.'
  notes: "TICKET INC-1042 (Priority 2)\nReported by: user at PC1 (10.10.10.1), building A\n\"Since last night's change window I can't reach PC2 (10.10.10.2) in building B.\n We're both in VLAN 10. It worked before the change.\"\nChange record: \"Uplink between SW1 and SW2 reconfigured.\" No other details.\n\nTICKET INC-1043 (Priority 4) - opened by monitoring, may only show up later\n\"SW1 is logging repeated warnings about the SW1-SW2 link. Please investigate.\"\n\nRules: find the root cause from the device output before you change anything.\nFor each ticket write down: symptom -> what you checked -> root cause -> fix -> how you proved it's fixed.\n"
  title: 'Day 6 - Lab 1 TICKETS: SW1-SW2 outage'
  version: 0.3.0
