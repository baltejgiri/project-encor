lab:
  description: Ch 1 Lab 1 - VLANs, trunking, 802.1Q frame fields, CAM table, MAC learning,
    and L2 flooding.
  notes: |-
    Topology: SW1 ---trunk--- SW2
              PC1 on SW1 VLAN 10
              PC2 on SW2 VLAN 10
              PC3 on SW2 VLAN 20

    Pre-configured: VLANs 10/20, access ports, PC IPs
    Student task: configure trunk on SW1 Gi0/0 and SW2 Gi0/0

    Objectives:
      1. Configure 802.1Q trunk between SW1 and SW2
      2. Verify with show interfaces trunk
      3. Packet capture on trunk link to observe 802.1Q frame fields
      4. Verify MAC table population after pinging
      5. Observe flooding behavior after clearing MAC table
      6. Diagnose native VLAN mismatch (change SW2 native to 99)
      7. Compare MAC table before and after traffic
      8. Use L2 diagnostic commands
  title: 'Ch 1 – Lab 1: VLANs, Trunking, and 802.1Q Frame Analysis'
  version: 0.3.0
