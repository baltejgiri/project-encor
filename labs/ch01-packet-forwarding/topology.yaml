lab:
  description: Chapter 1 - Packet Forwarding. Explore CEF, FIB, adjacency table, and
    Layer 2/3 forwarding decisions.
  notes: |-
    Topology:
      R1 (Lo0: 10.1.1.1/32) --- SW1 --- R2 (Lo0: 10.2.2.2/32)
                           192.168.1.0/24

    IP Addressing:
      R1 Gi0/0: 192.168.1.1/24  |  R1 Lo0: 10.1.1.1/32
      R2 Gi0/0: 192.168.1.2/24  |  R2 Lo0: 10.2.2.2/32

    Static routes pre-configured:
      R1: 10.2.2.2/32 via 192.168.1.2
      R2: 10.1.1.1/32 via 192.168.1.1

    Objectives:
      1. Verify CEF is enabled and examine the FIB table
      2. Examine the adjacency table entries
      3. Trace a packet Layer 3 forwarding decision through the FIB
      4. Examine the MAC address table on SW1
      5. Verify ARP resolution and its role in CEF adjacency
      6. Compare process switching vs CEF behavior
  title: CCNP ENCOR - Ch 1 Packet Forwarding
  version: 0.3.0
