lab:
  description: Chapter 1 - Forwarding Architectures. CEF, FIB, adjacency table, process
    switching, TCAM, SDM templates, centralized vs. distributed forwarding, multi-hop L3.
  notes: |-
    Topology:
      R1 --- SW1 --- R2 --- R3
      192.168.1.0/24    192.168.2.0/24

    IP Addressing:
      R1 Gi0/0: 192.168.1.1/24  |  R1 Lo0: 10.1.1.1/32
      R2 Gi0/0: 192.168.1.2/24  |  R2 Gi0/1: 192.168.2.2/24  |  R2 Lo0: 10.2.2.2/32
      R3 Gi0/0: 192.168.2.3/24  |  R3 Lo0: 10.3.3.3/32

    Static routes pre-configured on all routers for full reachability.

    Objectives:
      1. Verify CEF and interpret show ip cef output
      2. Interpret FIB entries for static routes
      3. Examine adjacency table and L2 rewrite info
      4. Observe MAC table on SW1 after traffic
      5. Compare process switching vs CEF
      6. Disable CEF on R2 Gi0/0, compare CPU before/after
      7. Multi-hop trace R1 Lo0 -> R3 Lo0 (FIB + adjacency at each hop)
      8. show sdm prefer on SW1 - TCAM explanation
      9. Centralized vs distributed CEF comparison
      10. Re-enable CEF and verify recovery
  title: CCNP ENCOR - Ch1 Lab3 Forwarding Architectures
  version: 0.3.0
