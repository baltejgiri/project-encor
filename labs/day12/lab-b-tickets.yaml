  notes: 'TICKET INC-2051 (Priority 2)

    Reported by: user at PC2 (10.10.10.2), building C

    "Our new switch SW3 went in yesterday and I can''t reach PC1 (10.10.10.1) in building A. We''re both on the USERS network."

    Change record: "SW3 installed and connected to SW2. Standard config applied."


    TICKET INC-2052 (Priority 3), opened by monitoring

    "The SW1-SW2 uplink is supposed to be a two-link bundle. Monitoring says it''s only using one link."


    Rules: find the root cause from the device output before you change anything.

    For each ticket write down: symptom -> what you checked -> root cause -> fix -> how you proved it''s fixed.

    '
  title: 'Day 12 - Lab B TICKETS: building C outage'
