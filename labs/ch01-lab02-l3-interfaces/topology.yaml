          interface GigabitEthernet0/2
           description PC2-ACCESS-VLAN20
           switchport mode access
           switchport access vlan 20
           no shutdown
          !
          interface GigabitEthernet0/3
           description CONFIGURE-NO-SWITCHPORT-TO-R2
           no shutdown
          !
          interface Vlan10
           description SVI-VLAN10--CONFIGURE-THIS
           no shutdown
          !
          interface Vlan20
           description SVI-VLAN20--CONFIGURE-THIS
