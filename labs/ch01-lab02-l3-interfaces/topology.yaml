lab:
  description: Ch 1 Lab 2 - SVIs, subinterfaces, routed ports, secondary IPv4, dual-stack
    IPv6, L3 verification.
  notes: |-
    Topology: R1 ---trunk--- SW1 ---routed-port--- R2
                              |
                           PC1 (VLAN10, 10.10.10.10/24, GW .254)
                           PC2 (VLAN20, 10.20.20.10/24, GW .254)

    Pre-configured: VLANs 10/20, trunk SW1-R1, access ports, PC IPs/default routes
    Student configures: all L3 addressing on SVIs, subinterfaces, routed port, R2

    Addressing targets:
      R1 Gi0/0.10: 10.10.10.254/24 (primary), 172.16.10.254/24 (secondary), 2001:db8:10::1/64
      R1 Gi0/0.20: 10.20.20.254/24, 2001:db8:20::1/64
      SW1 VLAN10 SVI: 10.10.10.1/24, 2001:db8:10::2/64
      SW1 VLAN20 SVI: 10.20.20.1/24, 2001:db8:20::2/64
      SW1 Gi0/3 (no switchport): 172.30.0.1/30, 2001:db8:30::1/64
      R2 Gi0/0: 172.30.0.2/30, 2001:db8:30::2/64
  title: 'Ch1 Lab2 - L3 Interfaces: SVIs, Subinterfaces, Routed Ports'
  version: 0.3.0
