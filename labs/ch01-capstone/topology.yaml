lab:
  description: Ch 1 Capstone - Part I integrated troubleshooting lab with 5 pre-injected
    faults.
  notes: |-
    FAULT SUMMARY (do not read before diagnosing!):
      1. Native VLAN mismatch: SW-ACC native=1, SW-CORE native=99
      2. VLAN 20 missing from SW-CORE VLAN database -> PC2 isolated
      3. R1 Gi0/0.10 missing encapsulation dot1Q 10 -> PC1 cannot reach gateway
      4. CEF disabled on R2 Gi0/0 (no ip route-cache cef) -> process switching
      5. SW-CORE Gi0/3 still a switchport -> no L3 link to R2

    Intended addressing:
      R1 Gi0/0.10: 10.10.10.254/24, 2001:db8:10::1/64
      R1 Gi0/0.20: 10.20.20.254/24, 2001:db8:20::1/64
      R1 Gi0/0.30: 10.30.30.254/24, 2001:db8:30::1/64
      SW-CORE VLAN10 SVI: 10.10.10.1/24, 2001:db8:10::2/64
      SW-CORE VLAN20 SVI: 10.20.20.1/24, 2001:db8:20::2/64
      SW-CORE VLAN30 SVI: 10.30.30.1/24, 2001:db8:30::2/64
      SW-CORE Gi0/3 (no switchport): 172.31.0.1/30
      R2 Gi0/0: 172.31.0.2/30  |  R2 Lo0: 10.99.99.99/32
      PC1: 10.10.10.10/24 GW .254 | PC2: 10.20.20.10/24 GW .254 | PC3: 10.10.10.11/24 GW .254

    Goal: fix all 5 faults, verify PC1/PC2/PC3 can reach R2 Lo0 (10.99.99.99)
  title: 'CCNP ENCOR - Ch1 Capstone: Part I Integrated Lab'
  version: 0.3.0
